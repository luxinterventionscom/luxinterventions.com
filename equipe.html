<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src https://luxinterventions-hitcounter.weathered-tree-cfd3.workers.dev; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="esp-api" content="https://luxinterventions-hitcounter.weathered-tree-cfd3.workers.dev">
<meta name="theme-color" content="#0f766e">
<title>NOBIS Équipe</title>
<link rel="icon" type="image/png" sizes="32x32" href="/ares/icons/favicon-32.png">
<link rel="manifest" href="/equipe.webmanifest">
<link rel="apple-touch-icon" href="/ares/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NOBIS Équipe">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<style>
  :root { --bg: #f3f5f4; --card: #fff; --text: #1a1a1a; --muted: #5f6763; --line: #e1e6e3; --accent: #0f766e; --green: #15803d; --red: #b91c1c; --amber: #b45309; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: 'DM Sans', system-ui, sans-serif; font-size: 16px; line-height: 1.5; }
  main { max-width: 680px; margin: 0 auto; padding: 16px 16px 40px; padding-top: max(16px, env(safe-area-inset-top)); }
  .top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 8px; }
  .brandx { display: flex; align-items: center; gap: 8px; min-width: 0; white-space: nowrap; }
  .top-logo { height: 32px; width: auto; border-radius: 6px; background: #fff; padding: 2px 4px; flex: none; }
  .langs { display: flex; gap: 4px; flex-wrap: wrap; }
  .langs button { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 4px 10px; font: inherit; font-size: 13px; font-weight: 700; color: var(--muted); cursor: pointer; }
  .langs button[aria-pressed="true"] { background: var(--text); color: #fff; border-color: var(--text); }
  h1 { font-size: 24px; margin: 6px 0 0; line-height: 1.2; }
  .sub { color: var(--muted); margin: 2px 0 16px; }
  .card { background: var(--card); border-radius: 16px; padding: 16px; margin-bottom: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
  .warnc { background: #fff7e6; border: 1px solid #f5d0a0; }
  .okc { background: #e8f7ee; border: 1px solid #b7e4c7; color: var(--green); font-weight: 600; }
  h2 { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
  .row { display: flex; gap: 12px; align-items: flex-start; padding: 9px 0; border-top: 1px solid var(--line); }
  .row:first-of-type { border-top: 0; }
  .grow { flex: 1; min-width: 0; }
  .meta { color: var(--muted); font-size: 14px; }
  .day { font-weight: 800; text-transform: capitalize; margin: 12px 0 4px; }
  .task { border: 1px solid var(--line); border-radius: 14px; padding: 12px; margin-top: 10px; }
  .task.done { opacity: .75; background: #f6fbf8; }
  .task .tt { font-size: 17px; }
  .cons { margin-top: 6px; padding: 8px 10px; border-radius: 10px; background: #f4f4f0; font-size: 15px; white-space: pre-wrap; }
  .stline { margin-top: 8px; font-weight: 700; font-size: 15px; }
  .stline.fait { color: var(--green); } .stline.incomplet { color: var(--red); } .stline.encours { color: var(--amber); }
  .tag { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
  .tag.bad { background: #fee2e2; color: var(--red); }
  .btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .btns .btn { flex: 1 1 30%; }
  .btn { display: inline-block; text-align: center; text-decoration: none; background: var(--accent); color: #fff; font: inherit; font-weight: 700; padding: 12px 14px; border-radius: 12px; border: 0; cursor: pointer; }
  .btn.sec { background: var(--card); color: var(--text); border: 1px solid var(--line); }
  .btn.ok { background: var(--green); } .btn.warn { background: #fff; color: var(--red); border: 1px solid #fca5a5; }
  .btn.sm { padding: 6px 10px; font-size: 14px; }
  .btn.block { display: block; width: 100%; }
  .btn:disabled { opacity: .6; }
  form.act { margin-top: 10px; padding: 10px; border-radius: 12px; background: var(--bg); }
  textarea, input[type=text], input[type=tel], input[type=email], input[type=date], select { width: 100%; font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
  textarea { min-height: 90px; }
  label { display: block; font-size: 14px; font-weight: 600; color: var(--muted); margin: 10px 0 4px; }
  details.more summary { cursor: pointer; font-weight: 700; color: var(--accent); padding: 8px 0; }
  .notice { font-size: 13px; }
  .err { text-align: center; color: var(--muted); padding: 40px 10px; }
</style>
</head>
<body>
<main id="app"><p class="err">…</p></main>
<noscript><p style="padding:24px;font-family:sans-serif">JavaScript est nécessaire pour utiliser cette application.</p></noscript>
<script type="module" src="/equipe.js"></script>
</body>
</html>
