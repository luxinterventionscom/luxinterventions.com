<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://luxinterventions-hitcounter.weathered-tree-cfd3.workers.dev; connect-src https://luxinterventions-hitcounter.weathered-tree-cfd3.workers.dev; frame-src blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="esp-api" content="https://luxinterventions-hitcounter.weathered-tree-cfd3.workers.dev">
<meta name="theme-color" content="#4f46e5">
<title>ARES Locataires</title>
<link rel="icon" type="image/png" sizes="32x32" href="/ares/icons/favicon-32.png">
<link rel="manifest" href="/espace.webmanifest">
<link rel="apple-touch-icon" href="/ares/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ARES Locataires">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<style>
  :root { --bg: #f5f4f0; --card: #fff; --text: #1a1a1a; --muted: #6b675f; --line: #e6e3dc; --accent: #4f46e5; --green: #15803d; --red: #b91c1c; --amber: #b45309; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: 'DM Sans', system-ui, sans-serif; font-size: 16px; line-height: 1.5; }
  main { max-width: 680px; margin: 0 auto; padding: 16px 16px 40px; }
  .top { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 8px; }
  .langs { display: flex; gap: 4px; }
  .langs button { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 4px 10px; font: inherit; font-size: 13px; font-weight: 700; color: var(--muted); cursor: pointer; }
  .langs button[aria-pressed="true"] { background: var(--text); color: #fff; border-color: var(--text); }
  h1 { font-size: 24px; margin: 6px 0 0; line-height: 1.2; }
  .sub { color: var(--muted); margin: 2px 0 16px; }
  .card { background: var(--card); border-radius: 16px; padding: 16px; margin-bottom: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
  h2 { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
  .row { display: flex; gap: 12px; align-items: flex-start; padding: 9px 0; border-top: 1px solid var(--line); }
  .row:first-of-type { border-top: 0; }
  .grow { flex: 1; min-width: 0; }
  .meta { color: var(--muted); font-size: 14px; }
  .months { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin: 8px 0; }
  .m { text-align: center; border-radius: 10px; padding: 6px 2px; font-size: 13px; font-weight: 700; background: #f0eee8; color: var(--muted); }
  .m small { display: block; font-weight: 600; }
  .m.paid { background: #dcfce7; color: var(--green); } .m.part { background: #fef3c7; color: var(--amber); } .m.late { background: #fee2e2; color: var(--red); } .m.off { opacity: .45; }
  .big { font-size: 22px; font-weight: 800; }
  .ok { color: var(--green); } .bad { color: var(--red); }
  .btn { display: inline-block; text-align: center; text-decoration: none; background: var(--accent); color: #fff; font: inherit; font-weight: 700; padding: 11px 14px; border-radius: 12px; border: 0; cursor: pointer; }
  .btn.sec { background: var(--card); color: var(--text); border: 1px solid var(--line); }
  .btn.sm { padding: 6px 10px; font-size: 14px; }
  .btn.block { display: block; width: 100%; }
  textarea, input[type=text], input[type=tel], select { width: 100%; font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
  textarea { min-height: 110px; }
  label { display: block; font-size: 14px; font-weight: 600; color: var(--muted); margin: 10px 0 4px; }
  .light { display: inline-block; width: 12px; height: 12px; border-radius: 50%; vertical-align: middle; }
  .l-green { background: #16a34a; } .l-yellow { background: #f59e0b; } .l-red { background: #dc2626; }
  .avis { background: #fff7e6; border: 1px solid #f5d0a0; }
  .notice { font-size: 13px; color: var(--muted); }
  details summary { cursor: pointer; font-weight: 700; }
  .err { text-align: center; color: var(--muted); padding: 40px 10px; }
  #quit { display: none; }
  @media print {
    body.printing main { display: none; }
    body.printing #quit { display: block; padding: 10mm; font-size: 12pt; }
  }
.install-big { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; border: 0; border-radius: 18px; padding: 14px 16px; margin: 0 0 14px; background: #4f46e5; color: #fff; font: inherit; cursor: pointer; box-shadow: 0 6px 18px rgba(79,70,229,.3); }
.install-big .ph { font-size: 34px; line-height: 1; }
.install-big .tx { flex: 1; display: flex; flex-direction: column; gap: 2px; }
.install-big b { font-size: 17px; }
.install-big small { opacity: .9; font-size: 13px; }
.install-big .go { font-size: 30px; opacity: .8; }
#guide { position: fixed; inset: 0; z-index: 60; overflow: auto; background: #f5f4f0; color: #1d1b16; padding: 16px; padding-top: max(16px, env(safe-area-inset-top)); }
#guide .g-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
#guide .g-head b { flex: 1; font-size: 18px; }
#guide .g-langs { margin: 0 0 10px; }
.g-tabs { display: flex; gap: 6px; margin: 0 0 12px; }
.g-tabs button { flex: 1; border: 1px solid #d6d3c8; background: #fff; border-radius: 12px; padding: 10px; font: inherit; font-weight: 600; cursor: pointer; }
.g-tabs button[aria-pressed="true"] { background: #1d1b16; color: #fff; border-color: #1d1b16; }
.g-steps { list-style: none; margin: 0; padding: 0; }
.g-steps li { background: #fff; border-radius: 16px; padding: 12px; margin: 0 0 12px; }
.g-txt { display: flex; gap: 10px; align-items: flex-start; font-size: 16px; line-height: 1.4; margin-bottom: 10px; }
.g-txt .n { flex: 0 0 28px; height: 28px; border-radius: 50%; background: #4f46e5; color: #fff; display: grid; place-items: center; font-weight: 700; }
.mk { max-width: 300px; margin: 0 auto; border: 2px solid #1d1b16; border-radius: 18px; overflow: hidden; background: #fafafa; font-size: 13px; }
.mk-page { height: 46px; background: repeating-linear-gradient(#eee 0 8px, #fafafa 8px 16px); }
.mk-bar { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: #e9e9ee; }
.mk-url { flex: 1; background: #fff; border-radius: 999px; padding: 5px 10px; color: #555; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hi { display: inline-block; padding: 3px 9px; border-radius: 999px; font-weight: 800; color: #fff; background: #dc2626; box-shadow: 0 0 0 4px rgba(220,38,38,.3); animation: pulse 1.4s infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 9px rgba(220,38,38,.12); } }
.mk-sheet { background: #f2f2f7; padding: 6px; }
.mk-row { background: #fff; padding: 9px 12px; border-bottom: 1px solid #eee; }
.mk-row.hi-row { background: #fee2e2; color: #b91c1c; font-weight: 800; outline: 3px solid #dc2626; border-radius: 10px; position: relative; }
.mk-top { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; background: #f2f2f7; color: #2563eb; }
.mk-dlg { display: flex; gap: 10px; align-items: center; padding: 12px; }
.mk-dlg img, .mk-adlg img { width: 44px; height: 44px; border-radius: 10px; }
.mk-dlg small { display: block; color: #777; }
.mk-home { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 14px; background: linear-gradient(135deg, #818cf8, #c084fc); }
.mk-home i { aspect-ratio: 1; border-radius: 10px; background: rgba(255,255,255,.45); }
.mk-home .hi-app { display: flex; flex-direction: column; align-items: center; gap: 2px; color: #fff; font-weight: 700; }
.mk-home .hi-app img { width: 100%; aspect-ratio: 1; border-radius: 10px; box-shadow: 0 0 0 3px #fff, 0 0 0 6px #dc2626; }
.mk-adlg { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px; background: #fff; }
.mk-btns { display: flex; gap: 14px; align-items: center; color: #1a73e8; }
.steps { margin: 0; padding-left: 22px; }
.steps li { margin: 0 0 10px; line-height: 1.45; }
.share-ic { width: 20px; height: 20px; vertical-align: -4px; color: #2563eb; pointer-events: none; }
.chat { display: flex; flex-direction: column; gap: 8px; max-height: 55vh; overflow: auto; padding: 10px; background: #f1efe8; border-radius: 14px; margin-bottom: 8px; }
.bub { max-width: 85%; align-self: flex-start; background: #fff; border-radius: 14px 14px 14px 4px; padding: 8px 10px; }
.bub.me { align-self: flex-end; background: #e0e7ff; border-radius: 14px 14px 4px 14px; }
.bub.mgr { background: #fef3c7; }
.bub-h { font-size: 12px; color: #6b6557; }
.bub-h b { color: #1d1b16; }
.bub-x { white-space: pre-wrap; word-break: break-word; margin-top: 2px; }
.chat-form { display: flex; gap: 8px; align-items: flex-end; }
.chat-form textarea { flex: 1; min-height: 46px; margin: 0; }
.chat-form .btn { width: auto; padding: 12px 16px; }
.pre { white-space: pre-wrap; }
.pill { display: inline-block; margin-top: 4px; border: 0; border-radius: 999px; padding: 4px 10px; font: inherit; font-size: 12px; font-weight: 700; background: #e0e7ff; color: #3730a3; cursor: pointer; }
.pill.new { background: #dc2626; color: #fff; }
label.chk { display: flex; gap: 8px; align-items: flex-start; font-weight: 400; font-size: 13px; margin-top: 10px; }
label.chk input { width: 20px; height: 20px; flex: 0 0 20px; margin-top: 2px; }
.bin { white-space: nowrap; }
.bin::before { content: ''; display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--c); margin-right: 5px; vertical-align: 1px; }
details.fold > summary { list-style: none; cursor: pointer; display: flex; align-items: center; flex-wrap: wrap; gap: 4px 10px; padding-right: 26px; position: relative; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary::after { content: '›'; position: absolute; right: 2px; top: -2px; font-size: 24px; color: var(--muted); transition: transform .25s; }
details.fold[open] > summary::after { transform: rotate(90deg); }
details.fold > summary h2 { margin: 0; }
details.fold > summary .sum { font-size: 14px; color: var(--muted); font-weight: 600; flex-basis: 100%; }
details.fold > summary .sum .ok { color: var(--green); } details.fold > summary .sum .bad { color: var(--red); }
details.fold[open] > summary .sum { display: none; }
details.fold .fold-body { margin-top: 10px; }
/* Carte ouverte : lueur chaude et douce qui « respire » */
details.fold[open], .card:has(> details[open]) { animation: warm 2.8s ease-in-out infinite; box-shadow: 0 0 0 1.5px rgba(245, 158, 11, .45), 0 0 16px 2px rgba(251, 191, 36, .28); }
@keyframes warm { 0%, 100% { box-shadow: 0 0 0 1.5px rgba(245, 158, 11, .40), 0 0 12px 1px rgba(251, 191, 36, .22); } 50% { box-shadow: 0 0 0 2px rgba(245, 158, 11, .60), 0 0 24px 5px rgba(251, 191, 36, .38); } }
@media (prefers-reduced-motion: reduce) { details.fold[open], .card:has(> details[open]) { animation: none; } }
.card.bin { border-left: 5px solid #f59e0b; }
.card.bin.now { background: #fffbeb; box-shadow: 0 0 0 2px rgba(245,158,11,.5), 0 0 18px rgba(251,191,36,.35); }
.card.bin.help { background: #eff6ff; border-left-color: #2563eb; }
.card.bin.ok { border-left-color: #16a34a; }
.bin-btns { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.bin-btns .btn { flex: 1; width: auto; }
.bub.sys { align-self: center; max-width: 95%; background: transparent; box-shadow: none; font-size: 13px; color: #6b675f; text-align: center; font-style: italic; }
.card.board h2 { margin-bottom: 6px; }
.card.board .row { align-items: center; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 10px; }
.chip { border: 0; border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
.chip.ok { background: #dcfce7; color: #166534; }
.chip.no { background: #fef3c7; color: #92400e; }
.pv { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.88); display: flex; flex-direction: column; }
.pv-bar { display: flex; gap: 8px; align-items: center; padding: 10px 12px; padding-top: max(10px, env(safe-area-inset-top)); background: #fff; color: #1d1b16; }
.pv-bar b { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pv img { flex: 1; min-height: 0; width: 100%; object-fit: contain; }
.pv iframe { flex: 1; border: 0; width: 100%; background: #fff; }
details.more { margin-top: 6px; }
details.more > summary { cursor: pointer; font-weight: 600; color: #4f46e5; padding: 10px 0; list-style: none; }
details.more > summary::before { content: '▸ '; }
details.more[open] > summary::before { content: '▾ '; }
</style>
</head>
<body>
<main id="app"><p class="err">…</p></main>
<div id="quit"></div>
<script type="module" src="/espace.js"></script>
</body>
</html>
