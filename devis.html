<style>
  :root { --bg: #f6f1ec; --card: #fff; --text: #1f1f1f; --muted: #6b6b6b; --line: #e7ddd5; --accent: #c8673a; --navy: #1b2e4b; --green: #1f8a4c; --red: #c0392b; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background: var(--bg); color: var(--text); line-height: 1.45; padding: 16px; padding-bottom: 40px; }
  .wrap { max-width: 620px; margin: 0 auto; }
  header { display: flex; gap: 12px; align-items: center; margin: 4px 0 16px; }
  header img { width: 46px; height: 46px; border-radius: 10px; background: #fff; }
  header b { display: block; font-size: 18px; letter-spacing: .5px; } header span { color: var(--muted); font-size: 13px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 18px; margin-bottom: 14px; box-shadow: 0 4px 18px rgba(0,0,0,.04); }
  h1 { font-size: 22px; margin-bottom: 2px; } .no { color: var(--muted); font-size: 13px; word-break: break-all; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin-top: 12px; font-size: 15px; } .kv dt { color: var(--muted); } .kv dd { font-weight: 600; }
  .big { font-size: 26px; font-weight: 800; color: var(--navy); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font: inherit; font-weight: 700; font-size: 16px; border-radius: 14px; border: 1px solid var(--line); background: #fff; color: var(--text); padding: 13px 18px; cursor: pointer; text-decoration: none; min-height: 50px; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; } .btn.block { width: 100%; } .btn.ghost { background: none; border-color: transparent; color: var(--red); font-weight: 600; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; } .row .btn { flex: 1 1 200px; }
  label.f { display: block; font-size: 14px; font-weight: 600; color: var(--muted); margin: 12px 0 6px; }
  input[type=text] { width: 100%; font: inherit; font-size: 16px; padding: 12px; border-radius: 12px; border: 1px solid var(--line); }
  canvas { display: block; width: 100%; aspect-ratio: 30 / 11; background: #fff; border: 2px dashed #9aa5a0; border-radius: 14px; touch-action: none; }
  .chk { display: flex; gap: 10px; align-items: flex-start; margin-top: 12px; font-size: 14px; } .chk input { width: 22px; height: 22px; flex: none; margin-top: 1px; }
  .note { font-size: 13px; color: var(--muted); margin-top: 10px; }
  .ok { border-color: #bfe3cc; background: #f1fbf4; } .ko { border-color: #f1c4bd; background: #fdf3f1; }
  .err { color: var(--red); font-size: 14px; margin-top: 10px; min-height: 1em; }
  iframe { width: 100%; height: 70vh; border: 1px solid var(--line); border-radius: 14px; background: #fff; margin-top: 12px; }
  footer { text-align: center; font-size: 12px; color: var(--muted); margin-top: 18px; }
  [hidden] { display: none !important; }
</style>
<script type="module" src="/devis.js"></script>
</head>
<body>
<div class="wrap">
  <header><img src="/ares/icons/lux-192.png" alt=""><div><b>LuxInterventions</b><span>ARES INVEST S.A. · Luxembourg</span></div></header>
  <main id="main"><div class="card">Chargement du devis…</div></main>
  <footer>LuxInterventions — ARES INVEST S.A. · 37, Val Saint André · L-1128 Luxembourg · +352 691 423 943 · info@luxinterventions.com</footer>
</div>

</body>
</html>
